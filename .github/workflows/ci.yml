name: CI Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres  # ⚠️ Ne crée pas encore ta base de test ici
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Create test database
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE calistrackdb_test;"
        env:
          PGPASSWORD: postgres

      - name: Run tests
        run: ./gradlew test --info --stacktrace --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_KEY: ${{ secrets.JWT_KEY }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          DB_URL: jdbc:postgresql://localhost:5432/calistrackdb_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
